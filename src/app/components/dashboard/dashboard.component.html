<div class="container-fluid p-0">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="fw-bold text-dark m-0">Panel de Control</h4>
      <p class="text-muted small m-0">Resumen general de tu cartera de asegurados</p>
    </div>
    <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 rounded-pill fw-semibold">
      <i class="bi bi-check-circle-fill me-1"></i> Sesión Segura
    </span>
  </div>

  <!-- Tarjetas de Métricas -->
  <div class="row g-3 mb-4">
    <!-- Asegurados -->
    <div class="col-md-4">
      <div class="card card-metric bg-white p-3">
        <div class="d-flex align-items-center justify-content-between">
          <div>
            <span class="text-uppercase text-muted fw-semibold" style="font-size: 0.75rem; letter-spacing: 0.5px;">Asegurados Totales</span>
            <h2 class="fw-bold text-dark m-0 mt-1">0</h2>
          </div>
          <div class="icon-box bg-primary-subtle text-primary">
            <i class="bi bi-people-fill fs-4"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Pólizas Vigentes -->
    <div class="col-md-4">
      <div class="card card-metric bg-white p-3">
        <div class="d-flex align-items-center justify-content-between">
          <div>
            <span class="text-uppercase text-muted fw-semibold" style="font-size: 0.75rem; letter-spacing: 0.5px;">Pólizas Vigentes</span>
            <h2 class="fw-bold text-dark m-0 mt-1">0</h2>
          </div>
          <div class="icon-box bg-success-subtle text-success">
            <i class="bi bi-shield-check fs-4"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Próximos Vencimientos -->
    <div class="col-md-4">
      <div class="card card-metric bg-white p-3">
        <div class="d-flex align-items-center justify-content-between">
          <div>
            <span class="text-uppercase text-muted fw-semibold" style="font-size: 0.75rem; letter-spacing: 0.5px;">Próximos Vencimientos</span>
            <h2 class="fw-bold text-dark m-0 mt-1">0</h2>
          </div>
          <div class="icon-box bg-warning-subtle text-warning">
            <i class="bi bi-exclamation-triangle-fill fs-4"></i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Banner Informativo -->
  <div class="card card-metric bg-white p-4">
    <div class="d-flex align-items-center">
      <div class="bg-light p-3 rounded-circle me-3 text-primary">
        <i class="bi bi-info-circle fs-3"></i>
      </div>
      <div>
        <h6 class="fw-bold m-0 text-dark">Bienvenido al Portal de Gestión</h6>
        <p class="text-muted small m-0 mt-1">Selecciona <strong>Asegurados</strong> en el menú lateral para consultar, registrar o editar clientes de tu cartera.</p>
      </div>
    </div>
  </div>
</div>
