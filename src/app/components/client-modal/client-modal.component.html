<div class="modal-backdrop" *ngIf="show">
  <div class="modal-dialog modal-dialog-centered corporate-modal">
    <div class="modal-content custom-modal-card">

      <!-- Encabezado corporativo azul -->
      <div class="modal-header corporate-header">
        <h5 class="modal-title d-flex align-items-center gap-2">
          <i class="bi" [class.bi-person-plus-fill]="!client?.guid" [class.bi-person-gear]="client?.guid"></i>
          <span>{{ client?.guid ? 'Editar cliente' : 'Nuevo cliente' }}</span>
        </h5>
        <button type="button" class="btn-close btn-close-white" (click)="close()"></button>
      </div>

      <!-- Formulario principal -->
      <form [formGroup]="clientForm" (ngSubmit)="saveClient()" class="modal-form-wrapper">
        <div class="modal-body p-3 p-md-4">
          <div class="row g-2 g-md-3">

            <div class="col-6">
              <label class="form-label font-subtitle mb-1">Nombre(s) *</label>
              <input type="text" formControlName="firstName" class="form-control corporate-input"
                [class.is-invalid]="clientForm.get('firstName')?.touched && clientForm.get('firstName')?.invalid">
            </div>

            <div class="col-6">
              <label class="form-label font-subtitle mb-1">Apellido(s) *</label>
              <input type="text" formControlName="lastName" class="form-control corporate-input"
                [class.is-invalid]="clientForm.get('lastName')?.touched && clientForm.get('lastName')?.invalid">
            </div>

            <div class="col-12">
              <label class="form-label font-subtitle mb-1">Correo Electrónico *</label>
              <input type="email" formControlName="email" class="form-control corporate-input"
                [class.is-invalid]="clientForm.get('email')?.touched && clientForm.get('email')?.invalid">
            </div>

            <div class="col-6">
              <label class="form-label font-subtitle mb-1">Teléfono *</label>
              <input type="text" formControlName="phone" class="form-control corporate-input" placeholder="6621000000"
                [class.is-invalid]="clientForm.get('phone')?.touched && clientForm.get('phone')?.invalid">
            </div>

            <div class="col-6">
              <label class="form-label font-subtitle mb-1">RFC / ID</label>
              <input type="text" formControlName="identificationNumber" class="form-control corporate-input" placeholder="ABCD900101XXX">
            </div>

            <div class="col-6">
              <label class="form-label font-subtitle mb-1">Fecha de Nacimiento</label>
              <input type="date" class="form-control corporate-input" formControlName="birthDate" />
            </div>

            <div class="col-6">
              <label class="form-label font-subtitle mb-1">Ciudad</label>
              <input type="text" class="form-control corporate-input" placeholder="Ej. Hermosillo" formControlName="city"/>
            </div>

            <div class="col-12 mt-2">
              <label class="form-label font-subtitle mb-1 d-block">Tipo de Registro</label>
              <div class="segmented-control">
                <button 
                  type="button" 
                  class="segmented-btn" 
                  [class.active]="clientForm.get('clientType')?.value === 1"
                  (click)="setClientType(1)">
                  <i class="bi bi-person-check-fill me-1"></i> Cliente
                </button>
                <button 
                  type="button" 
                  class="segmented-btn" 
                  [class.active]="clientForm.get('clientType')?.value === 2"
                  (click)="setClientType(2)">
                  <i class="bi bi-person-badge-fill me-1"></i> Prospecto
                </button>
              </div>
            </div>

            <div class="col-12 mt-2">
              <div class="form-check form-switch pt-1">
                <input class="form-check-input" type="checkbox" formControlName="isActive" id="isActiveSwitch">
                <label class="form-check-label small fw-semibold" style="color: #334155;" for="isActiveSwitch">Cliente activo</label>
              </div>
            </div>

          </div>
        </div>

        <!-- Footer corporativo -->
        <div class="modal-footer corporate-footer">
          <button type="button" (click)="close()" class="btn btn-outline-secondary btn-modal-action">Cancelar</button>
          <button type="submit" [disabled]="clientForm.invalid" class="btn btn-corporate-primary btn-modal-action">
            <i class="bi bi-check-circle me-1"></i>
            {{ client?.guid ? 'Guardar Cambios' : 'Registrar' }}
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
