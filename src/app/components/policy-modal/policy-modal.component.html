<!-- 1. MINI DIÁLOGO DE CONFIRMACIÓN -->
<div class="modal-backdrop mini-dialog-backdrop" *ngIf="showPrompt">
  <div class="modal-dialog modal-dialog-centered mini-dialog">
    <div class="modal-content custom-modal-card text-center p-4">
      <div class="mb-3">
        <div class="icon-circle mx-auto bg-blue-soft text-navy">
          <i class="bi bi-file-earmark-check-fill fs-2"></i>
        </div>
      </div>
      <h5 class="fw-bold text-navy mb-2">Cliente Registrado con Éxito</h5>
      <p class="dialog-text mb-4">
        ¿Deseas agregar pólizas a <strong>{{ client?.firstName }} {{ client?.lastName }}</strong> en este momento?
      </p>
      <div class="d-flex justify-content-center gap-2">
        <button type="button" class="btn btn-outline-secondary px-3 fw-medium" (click)="onPromptResponse(false)">
          No, después
        </button>
        <button type="button" class="btn btn-corporate-primary px-3 fw-medium" (click)="onPromptResponse(true)">
          Sí, agregar
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 2. MODAL FORMULARIO DE PÓLIZAS -->
<div class="modal-backdrop" *ngIf="showPolicySection">
  <div class="modal-dialog modal-lg corporate-modal modal-dialog-centered">
    <div class="modal-content custom-modal-card">
      
      <!-- Encabezado Modal (FIJO ARRIBA) -->
      <div class="modal-header corporate-header">
        <h5 class="modal-title d-flex align-items-center">
          <i class="bi bi-shield-plus me-2"></i>
          Agregar póliza(s) - {{ client?.firstName }} {{ client?.lastName }}
        </h5>
        <button type="button" class="btn-close btn-close-white" (click)="closeModal()"></button>
      </div>

      <!-- Formulario principal envolvente -->
      <form [formGroup]="policyForm" (ngSubmit)="onSubmitPolicies()" class="modal-form-wrapper">
        
        <!-- Cuerpo del Modal (SOLO ESTO TIENE SCROLL) -->
        <div class="modal-body p-3 p-md-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-secondary font-subtitle">Capture la información de las pólizas a vincular.</span>
            <button type="button" class="btn btn-sm btn-outline-corporate" (click)="addPolicyField()">
              <i class="bi bi-plus-circle me-1"></i> <span class="d-none d-sm-inline">Agregar otra</span> Póliza
            </button>
          </div>

          <div formArrayName="policies">
            <div *ngFor="let policyGroup of policies.controls; let i = index" [formGroupName]="i" class="card policy-card mb-3">
              <div class="card-header policy-card-header d-flex justify-content-between align-items-center py-2 px-3">
                <span class="fw-semibold text-navy">Póliza #{{ i + 1 }}</span>
                <button type="button" class="btn-close btn-sm" *ngIf="policies.length > 1" (click)="removePolicyField(i)"></button>
              </div>
              
              <div class="card-body p-3">
                <!-- Datos Asegurado -->
                <div class="row g-2 g-md-3 mb-2 mb-md-3">
                  <div class="col-6 col-md-4">
                    <label class="form-label font-subtitle">Nombre *</label>
                    <input type="text" class="form-control corporate-input" formControlName="insuredFirstName" />
                  </div>
                  <div class="col-6 col-md-4">
                    <label class="form-label font-subtitle">Apellidos *</label>
                    <input type="text" class="form-control corporate-input" formControlName="insuredLastName" />
                  </div>
                  <div class="col-12 col-md-4">
                    <label class="form-label font-subtitle">F. Nacimiento</label>
                    <input type="date" class="form-control corporate-input" formControlName="insuredBirthDate" />
                  </div>
                </div>

                <!-- Datos Póliza -->
                <div class="row g-2 g-md-3 mb-2 mb-md-3">
                  <div class="col-6 col-md-3">
                    <label class="form-label font-subtitle">Tipo *</label>
                    <select class="form-select corporate-input" formControlName="policyType">
                      <option value="Vida">Vida</option>
                      <option value="Gastos Médicos">Gastos Médicos</option>
                      <option value="Auto">Auto</option>
                      <option value="Daños">Daños</option>
                    </select>
                  </div>
                  <div class="col-6 col-md-3">
                    <label class="form-label font-subtitle">No. póliza *</label>
                    <input type="text" class="form-control corporate-input" formControlName="policyNumber" />
                  </div>
                  <div class="col-6 col-md-3">
                    <label class="form-label font-subtitle">Aseguradora *</label>
                    <input type="text" class="form-control corporate-input" placeholder="Ej. GNP" formControlName="company" />
                  </div>
                  <div class="col-6 col-md-3">
                    <label class="form-label font-subtitle">Periodicidad *</label>
                    <select class="form-select corporate-input" formControlName="paymentFrequency">
                      <option value="Mensual">Mensual</option>
                      <option value="Trimestral">Trimestral</option>
                      <option value="Semestral">Semestral</option>
                      <option value="Anual">Anual</option>
                    </select>
                  </div>
                </div>

                <!-- Vigencias y Primas -->
                <div class="row g-2 g-md-3">
                  <div class="col-6 col-md-3">
                    <label class="form-label font-subtitle">Inicio vigencia *</label>
                    <input type="date" class="form-control corporate-input" formControlName="startDate" />
                  </div>
                  <div class="col-6 col-md-3">
                    <label class="form-label font-subtitle">Fin vigencia *</label>
                    <input type="date" class="form-control corporate-input" formControlName="endDate" />
                  </div>
                  <div class="col-6 col-md-2">
                    <label class="form-label font-subtitle">Prima neta *</label>
                    <input type="number" class="form-control corporate-input" formControlName="netPremium" />
                  </div>
                  <div class="col-6 col-md-2">
                    <label class="form-label font-subtitle">Prima total *</label>
                    <input type="number" class="form-control corporate-input" formControlName="totalPremium" />
                  </div>
                  <div class="col-12 col-md-2">
                    <label class="form-label font-subtitle">% Comisión *</label>
                    <input type="number" class="form-control corporate-input" formControlName="commissionPercentage" />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Footer con Botones (FIJO ABAJO CON MARGEN SEGURO) -->
        <div class="modal-footer corporate-footer">
            <button type="button" class="btn btn-outline-secondary btn-modal-action" (click)="closeModal()">Omitir
              <span class="d-none d-sm-inline">&nbsp;por ahora</span>
            </button>
            
            <button type="submit" class="btn btn-corporate-primary btn-modal-action">
              <i class="bi bi-shield-check me-1"></i> Guardar Póliza<span class="d-none d-sm-inline">(s)</span>
            </button>
        </div>

      </form>

    </div>
  </div>
</div>
